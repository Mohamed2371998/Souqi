<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المنتجات</title><link rel="stylesheet" href="/css/admin.css"></head><body>
<header><h1>إدارة المنتجات</h1><a href="/admin/index.html">عودة</a></header>
<main>
  <form id="productForm" enctype="multipart/form-data">
    <input id="name_ar" placeholder="اسم عربي" required>
    <input id="name_en" placeholder="English Name" required>
    <input id="category_id" type="number" placeholder="Category ID" required>
    <input id="price_sar" type="number" step="0.01" placeholder="السعر" required>
    <input id="stock_qty" type="number" placeholder="المخزون" required>
    <input id="brand" placeholder="العلامة">
    <label><input type="checkbox" id="installment_eligible"> مؤهل للتقسيط</label>
    <input id="image" type="file" accept="image/*">
    <button class="btn">حفظ</button>
  </form>
  <div id="adminProductsList"></div>
</main>
<script type="module" src="/js/admin-products.js"></script>
</body></html>
