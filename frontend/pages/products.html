<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المنتجات</title><link rel="stylesheet" href="/css/main.css"></head>
<body>
<header class="topbar"><a href="/index.html">الرئيسية</a><h2>المنتجات</h2><a href="/pages/cart.html">السلة</a></header>
<main class="products-layout">
  <aside class="sidebar">
    <h3>التصفية</h3>
    <label>التصنيف<select id="categoryFilter"></select></label>
    <label>السعر من <input id="priceMin" type="number"></label>
    <label>السعر إلى <input id="priceMax" type="number"></label>
    <label>العلامة التجارية <input id="brandFilter" type="text"></label>
    <label><input id="bnplFilter" type="checkbox"> مؤهل للتقسيط</label>
    <button id="applyFilters" class="btn">تطبيق</button>
  </aside>
  <section>
    <div class="toolbar">
      <input id="searchInput" placeholder="ابحث عن منتج">
      <select id="sortSelect">
        <option value="latest">الأحدث</option>
        <option value="rating">الأعلى تقييمًا</option>
        <option value="price_asc">السعر: من الأقل</option>
        <option value="price_desc">السعر: من الأعلى</option>
      </select>
    </div>
    <div id="productsGrid" class="grid"></div>
  </section>
</main>
<script type="module" src="/js/products.js"></script>
</body></html>
