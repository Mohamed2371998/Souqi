<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب جديد</title><link rel="stylesheet" href="/css/main.css"></head><body>
<main class="auth-card"><h2>إنشاء حساب</h2>
<form id="registerForm">
  <input id="name" placeholder="الاسم" required>
  <input id="email" type="email" placeholder="البريد" required>
  <input id="phone" placeholder="رقم الجوال" required>
  <input id="password" type="password" placeholder="كلمة المرور" required>
  <select id="preferred_lang"><option value="ar">العربية</option><option value="en">English</option></select>
  <button class="btn">تسجيل</button>
</form>
<a href="/pages/login.html">لديك حساب؟ تسجيل الدخول</a>
</main><script type="module" src="/js/auth.js"></script></body></html>
