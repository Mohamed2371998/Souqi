<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدفع</title><link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/checkout.css"></head>
<body>
<header class="topbar"><a href="/pages/cart.html">السلة</a><h2>إتمام الطلب</h2><a href="/index.html">الرئيسية</a></header>
<main class="checkout-grid">
<section>
  <h3>عنوان الشحن</h3>
  <form id="checkoutForm">
    <input id="full_name" placeholder="الاسم الكامل" required>
    <input id="phone" placeholder="رقم الجوال" required>
    <select id="city" required>
      <option value="">اختر المدينة</option>
      <option value="الرياض">الرياض</option><option value="جدة">جدة</option><option value="الدمام">الدمام</option>
      <option value="مكة">مكة</option><option value="المدينة">المدينة</option><option value="الخبر">الخبر</option><option value="تبوك">تبوك</option>
    </select>
    <input id="district" placeholder="الحي" required>
    <input id="street" placeholder="الشارع" required>
    <input id="postal_code" placeholder="الرمز البريدي" required>

    <h3>طريقة الدفع</h3>
    <div class="payment-cards" id="paymentCards">
      <label><input type="radio" name="payment" value="mada" checked> مدى</label>
      <label><input type="radio" name="payment" value="visa"> بطاقة ائتمانية</label>
      <label><input type="radio" name="payment" value="apple_pay"> Apple Pay</label>
      <label><input type="radio" name="payment" value="stc_pay"> STC Pay</label>
      <label><input type="radio" name="payment" value="tamara"> قسّم على 3 — بدون فوائد</label>
      <label><input type="radio" name="payment" value="tabby"> قسّم على 4 — بدون فوائد</label>
      <label><input type="radio" name="payment" value="cod"> الدفع عند الاستلام (+15 ر.س)</label>
    </div>

    <label>كود الخصم <input id="promoCode" placeholder="أدخل الكود"></label>
    <button type="button" id="applyPromo" class="btn secondary">تطبيق الكوبون</button>

    <button class="btn" type="submit">تأكيد الطلب</button>
  </form>
</section>
<aside class="summary-card">
  <h3>ملخص الطلب</h3>
  <div id="checkoutItems"></div>
  <p>المجموع قبل الضريبة: <span id="checkoutSubtotal">0</span> ر.س</p>
  <p>ضريبة القيمة المضافة (15%): <span id="checkoutVat">0</span> ر.س</p>
  <p>الشحن: <span id="shipping">0</span> ر.س</p>
  <h3>الإجمالي: <span id="checkoutTotal">0</span> ر.س</h3>
</aside>
</main>
<script type="module" src="/js/checkout.js"></script>
</body></html>
